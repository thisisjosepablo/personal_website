# Trayectoria profesional, de la más reciente a la más antigua (se muestra en este orden).
# Los puestos seguidos en la misma entidad se agrupan solos bajo un único logo, como en LinkedIn.
# Campos:
#   title:       puesto
#   entidad:     empresa, universidad o grupo (escríbela igual en todos sus puestos para agruparlos)
#   tipo:        Jornada completa, Media jornada, Contrato de investigación, Beca, Prácticas…
#   inicio/fin:  "AAAA-MM" (o "AAAA" si no recuerdas el mes). Sin fin = actualidad.
#                La duración se calcula sola cuando las fechas llevan mes; la de lo que sigue en
#                curso la calcula el navegador al abrir la página, así nunca se queda desfasada.
#   ubicacion:   ciudad, región, país
#   modalidad:   Presencial, Híbrido, En remoto
#   siglas:      texto del cuadrado del logo si no hay imagen (p. ej. UJA)
#   logo:        imagen del logo, cuadrada (opcional; ruta desde sobre-mi/, p. ej. imagenes/logos/uja.webp)
#   proyecto:    nombre del proyecto (opcional); proyecto-enlace: su página en la web
#   description: qué haces o hiciste
#   aptitudes:   lista de habilidades

